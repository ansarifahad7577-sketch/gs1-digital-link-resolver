# routes.yaml — GS1 Digital Link Resolver configuration
#
# Routes are matched top-to-bottom; first match wins.
# Copy this file to routes.yaml and adapt to your setup.

# Config schema version (optional; defaults to the resolver's current major).
# Stable under SemVer — see docs/stability.md. A breaking schema change bumps it.
version: 1
#
# NOTE: GTIN values in DL URIs are GTIN-14 — left-padded with zero for
#       GTIN-13 / GTIN-12 / GTIN-8 inputs. So a "books" GS1 prefix of
#       978 appears in DL URIs as "0978...". Prefix matches are literal
#       string-startswith on the value as it appears in the URI.

# Optional: pluggable DPP validator. Output appears as `gs1:validationStatus`
# in the link-set response. Failures are advisory and never block resolution.
#
#   type: noop    — default, ships zero overhead
#   type: smoke   — built-in URI-shape sanity check (no DPP fetch)
#   type: schema  — fetch the target DPP and validate it against a JSON Schema
#                   you control; requires schema_path. An illustrative
#                   (non-normative) profile ships under profiles/. Needs the
#                   `validators` extra: pip install '.[validators]'.
#                     schema_path: /app/profiles/illustrative-dpp.schema.json
#                     profile: illustrative-dpp
#   type: http    — delegate to an external CIRPASS-2/DPP validator service;
#                   requires endpoint (+ optional timeout). Needs httpx.
#                     endpoint: https://validator.example.com/validate
validator:
  type: smoke
  profile: smoke-builtin-v1

# Optional: operator metadata for the GS1 resolver description file served at
# /.well-known/gs1resolver (required of a GS1-conformant resolver). The whole
# block may be omitted — the two mandatory fields are then derived:
#
#   resolverRoot         → the origin the request arrived on. Behind a
#                          TLS-terminating proxy, either run uvicorn with
#                          --proxy-headers or set resolver_root explicitly.
#   supportedPrimaryKeys → inferred from the primary keys your routes below can
#                          actually match (here: 01 via gtin_* clauses, plus
#                          8003 from the GRAI rule).
#
# A catch-all route is NOT reported as "all" — declaring blanket support for
# every GS1 key is a claim to make deliberately via supported_primary_keys.
#
# The published document validates against
# https://ref.gs1.org/standards/resolver/description-file-schema
well_known:
  name: "Example DPP Resolver"
  # resolver_root: "https://id.example.com"
  # supported_primary_keys: ["01", "8003"]
  contact:
    fn: "Example Brand B.V."
    hasAddress:
      locality: "Amsterdam"
      country-name: "Netherlands"

resolvers:

  # Route by GTIN prefix (e.g. your brand's GS1 company prefix, padded)
  - match:
      gtin_prefix: "0978"
    target: "https://dpp.example.com/passport/{gtin}/{serial}"
    link_types:
      - rel: "gs1:pip"
        href: "https://dpp.example.com/passport/{gtin}/{serial}"
        type: "text/html"
        title: "Digital Product Passport"
      - rel: "gs1:verificationService"
        href: "https://dpp.example.com/api/verify/{gtin}/{serial}"
        type: "application/json"
        title: "Authenticity Verification"
      - rel: "gs1:digitalProductPassport"
        href: "https://dpp.example.com/dpp/{gtin}/{serial}.json"
        type: "application/ld+json"
        title: "ESPR-conformant DPP"

  # Internal / private GTINs (GS1 prefix 200–299, padded form "0200..0299")
  - match:
      gtin_regex: "^02[0-9]{12}$"
    target: "https://internal.example.com/dpp/{gtin}"
    link_types:
      - rel: "gs1:pip"
        href: "https://internal.example.com/dpp/{gtin}"
        type: "text/html"
        title: "Product Information"

  # GRAI-routed returnable assets (e.g. reusable transport packaging)
  - match:
      primary_ai: "8003"
    target: "https://assets.example.com/grai/{8003}"
    link_types:
      - rel: "gs1:pip"
        href: "https://assets.example.com/grai/{8003}"
        type: "text/html"

  # Fallback: forward unmatched GTINs to the GS1 global resolver
  - match: "*"
    target: "https://id.gs1.org/01/{gtin}"
    link_types:
      - rel: "gs1:pip"
        href: "https://id.gs1.org/01/{gtin}"
        type: "text/html"
        title: "GS1 Global Registry"
